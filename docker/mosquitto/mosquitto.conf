# VoltVision AI — Mosquitto MQTT Broker Config
# Place at: docker/mosquitto/mosquitto.conf

# ── Listeners ────────────────────────────────────────────────────────────────
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ── Persistence ──────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ── Logging ──────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# ── Security ─────────────────────────────────────────────────────────────────
# Development: allow anonymous. Production: set password_file
allow_anonymous true
# password_file /mosquitto/config/passwd

# ── Message limits ────────────────────────────────────────────────────────────
max_packet_size 65536
message_size_limit 65536
max_inflight_messages 40
max_queued_messages 1000

# ── Keep-alive ────────────────────────────────────────────────────────────────
keepalive_interval 60
